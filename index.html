<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Story Object Model — the open story-context standard for newsrooms</title>
    <meta name="description" content="SOM is an open JSON pub/sub standard for sharing story context across every tool in a newsroom — NRCS, MAM, transcription, graphics, compliance, playout." />
    <meta property="og:title" content="Story Object Model" />
    <meta property="og:description" content="An open JSON pub/sub standard for sharing story context across every tool in a newsroom." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" />
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('som-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
